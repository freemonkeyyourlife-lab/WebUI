<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K.I.T.T. — Instruct &amp; Repair</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #141c33;
        --panel-2: #1b2542;
        --ink: #e8edff;
        --muted: #9aa7c7;
        --accent: #ff8a00;
        --accent-2: #00d4a8;
        --danger: #ff5470;
        --line: #283356;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 600px at 80% -10%, #1a2a55 0%, var(--bg) 55%);
        color: var(--ink);
        min-height: 100vh;
      }
      a { color: var(--accent-2); }
      .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
      header.top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
      }
      .brand { display: flex; align-items: baseline; gap: 12px; }
      .brand h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
      .brand .sub { color: var(--muted); font-size: 13px; }
      .pill {
        font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
        background: #2a3350; color: var(--muted); border: 1px solid var(--line);
        white-space: nowrap;
      }
      .pill.online { background: rgba(0,212,168,.12); color: var(--accent-2); border-color: rgba(0,212,168,.4); }
      .pill.offline { background: rgba(255,84,112,.12); color: var(--danger); border-color: rgba(255,84,112,.4); }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
      .card {
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .card h2 { margin: 0 0 14px; font-size: 16px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
      input, textarea, select {
        width: 100%; padding: 10px 12px; border-radius: 9px;
        background: #0e1530; color: var(--ink); border: 1px solid var(--line);
        font: inherit;
      }
      textarea { min-height: 84px; resize: vertical; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      button {
        cursor: pointer; border: 1px solid var(--line); border-radius: 9px;
        padding: 10px 14px; font: inherit; font-weight: 600; color: var(--ink);
        background: #1c2748;
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent) 0%, #ff5a3c 100%);
        border-color: transparent; color: #1a1206;
      }
      button.ghost { background: transparent; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .toolbar .muted { color: var(--muted); font-size: 13px; }

      .task { border: 1px solid var(--line); border-radius: 11px; padding: 14px; margin-bottom: 12px; background: #0e1530; }
      .task .head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
      .task .title { font-weight: 600; }
      .task .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .badge.queued { color: #ffce6a; border-color: rgba(255,206,106,.4); }
      .badge.approved { color: var(--accent-2); border-color: rgba(0,212,168,.4); }
      .badge.ready { color: #7aa2ff; border-color: rgba(122,162,255,.4); }
      .task .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
      .empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 14px; }
      .toast {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        background: #0e1530; border: 1px solid var(--line); color: var(--ink);
        padding: 12px 18px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; font-size: 14px;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      .links { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; }
      code { background: #0e1530; padding: 1px 6px; border-radius: 5px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <h1>K.I.T.T. Instruct &amp; Repair</h1>
          <span class="sub">Safe, approval-gated local task orchestration</span>
        </div>
        <div id="statusPill" class="pill offline">checking…</div>
      </header>

      <div class="grid">
        <section class="card">
          <h2>New instruction request</h2>
          <form id="reqForm">
            <label for="title">Title</label>
            <input id="title" name="title" placeholder="Short summary of the request" />

            <label for="text">Request / prompt</label>
            <textarea id="text" name="text" placeholder="Describe what K.I.T.T. should do…"></textarea>

            <label for="link">Reference link (optional)</label>
            <input id="link" name="link" placeholder="https://…" />

            <label for="capability">Requested capability</label>
            <select id="capability" name="requestedCapability">
              <option value="general extension">General extension</option>
              <option value="repair">Repair / maintenance</option>
              <option value="voice">Voice / audio</option>
              <option value="webui">Web UI / dashboard</option>
              <option value="media">Image / video / music</option>
              <option value="security">Security / privacy</option>
            </select>

            <div class="row" style="margin-top:16px">
              <button type="submit" class="primary" id="submitBtn">Submit request</button>
              <button type="button" class="ghost" id="clearBtn">Clear</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="toolbar">
            <h2 style="margin:0">Request queue</h2>
            <span class="muted" id="countLabel"></span>
          </div>
          <div id="taskList">
            <div class="empty">Loading…</div>
          </div>
          <div class="links">
            <a href="/file_upload.html">File upload &amp; import →</a>
          </div>
        </section>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const toast = (msg) => {
        const t = $('#toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove('show'), 2600);
      };

      async function checkHealth() {
        try {
          const r = await fetch('/api/health');
          const j = await r.json();
          const p = $('#statusPill');
          if (r.ok && j.status === 'ok') {
            p.textContent = 'System ONLINE';
            p.className = 'pill online';
          } else {
            p.textContent = 'degraded';
            p.className = 'pill offline';
          }
        } catch {
          const p = $('#statusPill');
          p.textContent = 'offline';
          p.className = 'pill offline';
        }
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }

      function taskRow(t) {
        const status = escapeHtml(t.status || 'queued');
        const cat = escapeHtml(t.category || '—');
        const title = escapeHtml(t.title || 'Untitled request');
        const text = escapeHtml(t.text || '');
        const id = escapeHtml(t.id);
        const created = t.createdAt ? new Date(t.createdAt).toLocaleString() : '';
        const approved = t.status === 'approved' || t.status === 'ready';
        return `
          <div class="task" data-id="${id}">
            <div class="head">
              <div>
                <div class="title">${title}</div>
                <div class="meta">${cat} · ${created}${text ? ' · ' + text.slice(0,120) : ''}</div>
              </div>
              <span class="badge ${status}">${status}</span>
            </div>
            <div class="actions">
              <button class="ghost" data-act="approve" ${approved ? 'disabled' : ''}>Approve</button>
              <button class="ghost" data-act="resolve">Resolve</button>
            </div>
          </div>`;
      }

      async function loadTasks() {
        const list = $('#taskList');
        try {
          const r = await fetch('/api/requests');
          const tasks = await r.json();
          $('#countLabel').textContent = tasks.length ? `${tasks.length} item${tasks.length>1?'s':''}` : '';
          if (!tasks.length) {
            list.innerHTML = '<div class="empty">No requests yet. Submit one to get started.</div>';
            return;
          }
          list.innerHTML = tasks.map(taskRow).join('');
        } catch {
          list.innerHTML = '<div class="empty">Could not load requests.</div>';
        }
      }

      $('#reqForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          title: $('#title').value.trim(),
          text: $('#text').value.trim(),
          link: $('#link').value.trim(),
          requestedCapability: $('#capability').value,
        };
        if (!body.text && !body.link) { toast('Add a request or a link first.'); return; }
        const btn = $('#submitBtn');
        btn.disabled = true;
        try {
          const r = await fetch('/api/requests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Request failed'); }
          $('#text').value = ''; $('#link').value = ''; $('#title').value = '';
          toast('Request submitted');
          await loadTasks();
        } catch (err) {
          toast(err.message);
        } finally {
          btn.disabled = false;
        }
      });

      $('#clearBtn').addEventListener('click', () => {
        $('#title').value = ''; $('#text').value = ''; $('#link').value = '';
      });

      $('#taskList').addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const row = btn.closest('.task');
        const id = row.dataset.id;
        const act = btn.dataset.act;
        btn.disabled = true;
        try {
          const r = await fetch(`/api/requests/${encodeURIComponent(id)}/${act}`, { method: 'POST' });
          if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Action failed'); }
          toast(act === 'approve' ? 'Approved' : 'Resolved');
          await loadTasks();
        } catch (err) {
          toast(err.message);
          btn.disabled = false;
        }
      });

      checkHealth();
      loadTasks();
      setInterval(checkHealth, 15000);
    </script>
  </body>
</html>
